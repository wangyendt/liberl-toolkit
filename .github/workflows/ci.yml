name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q app.py achievement_ui.py achievements.py backend.py fishing.py fishing_loop.py game_input.py game_data.py win_memory.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
